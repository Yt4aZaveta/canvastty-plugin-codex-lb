services:
  codex-lb:
    image: ghcr.io/soju06/codex-lb:latest
    container_name: codex-lb
    restart: unless-stopped
    ports:
      - "2455:2455"
      - "1455:1455"
    volumes:
      - codex-lb-data:/var/lib/codex-lb
    networks:
      - codex-lb-net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:2456:2456"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - codex-lb-net
    depends_on:
      - codex-lb

networks:
  codex-lb-net:
    external: true

volumes:
  codex-lb-data:
    external: true
